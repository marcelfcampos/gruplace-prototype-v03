<!DOCTYPE html>
<html lang="pt-BR" data-nav-side="left">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Gruplace - Boas-vindas</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="css/pages/welcome.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    
</head>

<body>

    <!-- ============================================================
         SHELL PRINCIPAL RESPONSIVO
         ============================================================ -->

    <div class="app-shell">

        <!-- ========== BARRA LATERAL (desktop) / TOPO (mobile) ========== -->

        <aside class="app-sidebar" aria-label="Navegação principal">

            <!-- Logo / Brand -->

            <div class="sidebar-brand">
                <span class="sidebar-brand-mark">g</span>
                <span class="sidebar-brand-name">gruplace</span>
            </div>

            <!-- Navegação (visível no desktop) -->

            <nav class="sidebar-navigation">

                <a href="#" class="sidebar-navigation-link sidebar-navigation-link--active">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 10.5 12 3l9 7.5"></path>
                <path d="M5 9.8V21h14V9.8"></path>
            </svg>

                    Bem-vindo
                </a>

                <a href="#" class="sidebar-navigation-link">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M3 9l1.5-5h15L21 9"></path>
                        <path d="M4 9v10a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9"></path>
                        <path d="M9 20v-6a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v6"></path>
                        <path d="M3 9h18"></path>
                    </svg>

                    Lojas
                </a>

                <a href="#" class="sidebar-navigation-link">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                        stroke-linecap="round">
                        <circle cx="12" cy="9" r="3.4"></circle>
                        <path d="M5 20c1.4-3.2 4-4.6 7-4.6s5.6 1.4 7 4.6"></path>
                    </svg>

                    Perfil
                </a>

            </nav>

            <!-- Rodapé da sidebar (alternar posição - desktop) -->

            <div class="sidebar-position-control">

                <button id="toggle-nav-side" class="sidebar-position-button">
                    <svg xmlns="http://www.w3.org/2000/svg" class="sidebar-position-icon" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M8 7h12m0 0l-4-4m4 4l-4 4M16 17H4m0 0l4 4m-4-4l4-4" />
                    </svg>

                    <span id="toggle-nav-label">
                        Menu à direita
                    </span>
                </button>

            </div>

        </aside>

        <!-- ========== CONTEÚDO PRINCIPAL ========== -->

        <main class="app-main">

            <!-- CABEÇALHO / LOGO INTERNO (Oculto no desktop) -->

            <header class="mobile-brand-header">
                <span class="mobile-brand-name">
                    gruplace
                </span>
            </header>

            <!-- CONTEÚDO CENTRAL: Título, Descrição e Imagem do Shopping -->

            <section class="welcome-section">

                <!-- Títulos -->

                <div class="welcome-text">

                    <h1 class="welcome-title">
                        Tudo o que você ama,<br>em um só lugar.
                    </h1>

                    <p class="welcome-description">
                        Descubra lojas, produtos, novidades, ofertas e cupons dos shoppings mais perto de você.
                    </p>

                </div>

                <!-- Imagem Ilustrativa -->

                <div class="welcome-image-container">

                    <img src="https://images.unsplash.com/photo-1555529771-835f59fc5efe?w=600&auto=format&fit=crop&q=80"
                        alt="Shopping Center" class="welcome-image">

                    <div class="welcome-image-overlay"></div>

                </div>

            </section>

            <!-- RODAPÉ: Ações -->

            <footer class="welcome-footer">

                <!-- Botão Começar -->

                <button id="start-btn" class="start-button">
                    Começar
                </button>


                <!-- Link para quem já tem conta -->

                <div class="login-container">

                    <button id="login-link" class="login-button">
                        Já tenho uma conta
                    </button>

                </div>

            </footer>

        </main>

    </div>

    <!-- ============================================================
         JAVASCRIPT
         ============================================================ -->

    

    <script src="js/shared/nav-side.js"></script>
    <script src="js/pages/welcome.js"></script>
</body>

</html>
